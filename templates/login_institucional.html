{% extends "base.html" %}
{% block titulo %}Login Institucional{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">{% endblock %}
{% block conteudo %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <span class="form-icon">&#128274;</span>
            <h1>Acesso Institucional</h1>
            <p>Funcionários e Administradores</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login_institucional') }}" class="form">
            <div class="campo">
                <label for="email">E-MAIL INSTITUCIONAL</label>
                <input type="email" id="email" name="email" placeholder="nome@picos.pi.gov.br" required autofocus>
            </div>
            <div class="campo">
                <label for="senha">SENHA</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-primario btn-full">Entrar</button>
        </form>
        <div class="form-links">
            <a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a>
            <a href="#">Problemas com acesso? Contate o setor de TI</a>
        </div>
        <div class="form-extra">
            <a href="{{ url_for('auth.login') }}" class="link-institucional">Acesso Cidadão</a>
        </div>
    </div>
</div>
{% endblock %}
