{% extends "base.html" %}
{% block titulo %}Esqueci minha senha{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">{% endblock %}
{% block conteudo %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <span class="form-icon">&#128273;</span>
            <h1>Esqueci minha senha</h1>
            <p>Informe seu e-mail para receber instruções</p>
        </div>
        <form class="form">
            <div class="campo">
                <label for="email">E-MAIL</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail cadastrado" required>
            </div>
            <button type="submit" class="btn btn-primario btn-full">Recuperar senha</button>
        </form>
        <div class="form-links">
            <a href="{{ url_for('auth.login') }}">Voltar ao login</a>
        </div>
    </div>
</div>
{% endblock %}
